services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      MONGO_URI: "mongodb://admin:password123@host.docker.internal:27017"
      MONGO_DB: deephire
      REDIS_URL: "redis://host.docker.internal:6379"
      MINIO_ENDPOINT: "host.docker.internal:9000"
      MINIO_SECURE: "false"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      QDRANT_URL: "http://host.docker.internal:6333"
      QDRANT_API_KEY: "supersecret123"
      QDRANT_COLLECTION: "uzbek_candidates"
      EMBED_MODEL: "nomic-embed-text"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NEXT_PUBLIC_API_URL: "https://proaristocratic-sylvatic-kerstin.ngrok-free.dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  nginx:
    image: nginx:alpine
    ports:
      - "8085:8085"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
