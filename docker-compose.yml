services:
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file: ./.env        # Yagona root .env — barcha sozlamalar
    environment:
      # Docker ichida localhost o'rniga host.docker.internal ishlatiladi.
      # Bu qiymatlar .env dagi moslarini override qiladi.
      MONGO_URI:       "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-changeme}@host.docker.internal:27017/?authSource=admin"
      REDIS_URL:       "redis://host.docker.internal:6379"
      MINIO_ENDPOINT:  "host.docker.internal:9000"
      QDRANT_URL:      "http://host.docker.internal:6333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - hf_cache:/root/.cache/huggingface   # persist downloaded HF models across restarts
    command: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: production

  nginx:
    image: nginx:alpine
    ports:
      - "8385:8385"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  backend_venv:
  hf_cache:
